name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Must match 'version' in package.json and Version in UAI.LiteRTLM-CS/Directory.Build.props"
        required: true
      nuget-build:
        required: true
        default: true
        type: boolean

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      pages: write
      contents: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
        lfs: true
      
    - name: Save current commit
      run: echo "ORIGINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

    - name: Dotnet Setup
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    - name: Install DocFX
      run: dotnet tool update -g docfx
        
    - name: Generate Documentation
      run: docfx Documentation/docfx.json

    - name: Copy Files
      run: |
        PACKAGE_DIR="UAI.LiteRTLM/Packages/com.uralstech.uai.litertlm"

        mkdir -p "$PACKAGE_DIR/Documentation~"
        cp -f "Documentation/_site/api/APIReferenceManual.pdf" "$PACKAGE_DIR/Documentation~"
        cp -f "Documentation/_site/DocSource/Documentation.pdf" "$PACKAGE_DIR/Documentation~"
        cp -f "THIRD-PARTY-LICENSES.md" "$PACKAGE_DIR"
        cat > "$PACKAGE_DIR/THIRD-PARTY-LICENSES.md.meta" <<'EOF'
        fileFormatVersion: 2
        guid: b3787837ff20a4fee8accc29925b3cf2
        TextScriptImporter:
          externalObjects: {}
          userData: 
          assetBundleName: 
          assetBundleVariant: 
        EOF

    - name: Commit Files *locally*
      run: |
        PACKAGE_DIR="UAI.LiteRTLM/Packages/com.uralstech.uai.litertlm"

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add "$PACKAGE_DIR/Documentation~"
        git add "$PACKAGE_DIR/THIRD-PARTY-LICENSES.md"
        git add "$PACKAGE_DIR/THIRD-PARTY-LICENSES.md.meta"
        
        git commit -m "chore: include generated PDFs & 3rd party licenses notice in package" || echo "No changes to commit"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: 'Documentation/_site'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Clean up untracked DocFX files
      run: git clean -fdx

    - name: Pack UPM package
      uses: RageAgainstThePixel/upm-release@v2
      with:
          organization-id: ${{ secrets.UNITY_ORG_ID }}
          upm-service-account-key-id: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          upm-service-account-key-secret: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          package-json: 'UAI.LiteRTLM/Packages/com.uralstech.uai.litertlm/package.json'
          split-upm-branch: 'none'

    - name: Pack NuGet package
      if: ${{ inputs.nuget-build }}
      run: |
        git checkout -f "$ORIGINAL_SHA"
        dotnet pack UAI.LiteRTLM-CS/UAI.LiteRTLM/UAI.LiteRTLM.csproj -c Release

    - name: NuGet login
      id: nuget-login
      if: ${{ inputs.nuget-build }}
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Upload NuGet package
      if: ${{ inputs.nuget-build }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # auto generated token
        GH_REPO: ${{ github.repository }}
      run: |
        PACKAGE_BIN="UAI.LiteRTLM-CS/UAI.LiteRTLM/bin/Release/Uralstech.UAI.LiteRTLM.${{ inputs.tag }}"

        gh release upload ${{ inputs.tag }} "$PACKAGE_BIN.nupkg"
        gh release upload ${{ inputs.tag }} "$PACKAGE_BIN.snupkg"
      
    - name: Publish NuGet package
      if: ${{ inputs.nuget-build }}
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        PACKAGE_BIN="UAI.LiteRTLM-CS/UAI.LiteRTLM/bin/Release/Uralstech.UAI.LiteRTLM.${{ inputs.tag }}"
        dotnet nuget push "$PACKAGE_BIN.nupkg" --source https://api.nuget.org/v3/index.json
        dotnet nuget push "$PACKAGE_BIN.snupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate